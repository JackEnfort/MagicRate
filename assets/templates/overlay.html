<div style="margin-bottom: 12px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #2575fc;">MagicRate</div>
      
      <label style="font-size: 13px; font-weight: bold;">Number of Stories:</label>
      <select id="mp-num-stories" style="display: block; width: 100%; padding: 6px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px;">
        <option value="1" selected>Single Story</option>
        <option value="2">Double Story</option>
        <option value="3">3 Stories</option>
        <option value="4">4 Stories</option>
        <option value="5">5 Stories</option>
      </select>

      <div id="mp-svg-inputs-container"></div>

      <label style="font-size: 13px; font-weight: bold;">Select Layout CSV File:</label>
      <input type="file" id="mp-csv-file" accept=".csv" style="display: block; width: 100%; margin: 5px 0 15px 0;">

      <label style="font-size: 13px; font-weight: bold; display: none;">True North Offset (Degrees Clockwise):</label>
      <input type="number" id="mp-rotation-offset" value="0" min="0" max="359" style="display: none; width: 80px; padding: 6px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px;">

      <div class="extension-panel" style="margin-top: 15px; border-top: 2px dashed #2575fc; padding-top: 15px;">
        <h3 class="panel-title" style="margin-top: 0; font-size: 15px; color: #2575fc;">Whole of Home Automation Plugin</h3>
        
        <div class="form-group" style="margin-bottom: 10px;">
            <label for="address-selector" style="font-size: 13px; font-weight: bold;">Select Property Address:</label>
            <select id="address-selector" style="display: block; width: 100%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">Loading property index rows...</option>
            </select>
        </div>
        
        <button id="btn-analyse" disabled style="background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: not-allowed; width: 100%; font-weight: bold; margin-bottom: 10px;">Analyse Selected Record</button>
        
        <div id="analysis-output" class="analysis-card" style="background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef;">
            <h4 style="margin: 0 0 10px 0; font-size: 14px;">System Matrix Analysis Output</h4>
            
            <div class="device-list" style="font-size: 13px; margin-bottom: 8px;">
                <strong>Heating Devices Found:</strong>
                <div id="summary-heaters" style="color: #666;"></div>
            </div>
            
            <div id="heating-slider-block" class="slider-container" style="display:none; margin-bottom: 10px;">
                <div class="slider-labels" style="display: flex; justify-content: space-between; font-size: 11px; color: #555;">
                    <span id="lbl-heater1">Heater 1: 50%</span>
                    <span id="lbl-heater2">Heater 2: 50%</span>
                </div>
                <input type="range" id="heater-ratio" class="ratio-slider" min="0" max="100" value="50" style="width: 100%;">
            </div>

            <div class="device-list" style="font-size: 13px; margin-bottom: 8px;">
                <strong>Cooling Devices Found:</strong>
                <div id="summary-coolers" style="color: #666;"></div>
            </div>
            
            <div id="cooling-slider-block" class="slider-container" style="display:none; margin-bottom: 10px;">
                <div class="slider-labels" style="display: flex; justify-content: space-between; font-size: 11px; color: #555;">
                    <span id="lbl-cooler1">Cooler 1: 50%</span>
                    <span id="lbl-cooler2">Cooler 2: 50%</span>
                </div>
                <input type="range" id="cooling-ratio" class="ratio-slider" min="0" max="100" value="50" style="width: 100%;">
            </div>

            <div class="device-list" style="font-size: 13px; margin-bottom: 12px;">
                <strong>Hot Water System Found:</strong>
                <div id="summary-hotwater" style="color: #666;"></div>
            </div>
            
            <button id="btn-inject" style="background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer;">Insert Appliance Data</button>
        </div>
      </div>

      <div id="mp-status-msg" style="font-size: 13px; margin: 12px 0; font-weight: bold; color: #666;">Ready...</div>
      
      <button id="mp-filler-run" style="background: #2575fc; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer;">Run Automation</button>
      <button id="mp-filler-close" style="background: #dc3545; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; float: right;">Close</button>
      <br><br>
      <button id="ext-csv-export-btn" style="background:#28a745; color:white; padding:10px; width:100%; border:none; font-weight:bold; cursor:pointer; border-radius: 4px;">
                  Export Data to CSV
      </button>
      <div style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 8px; text-align: center;">
        <a href="{{EDITOR_URL}}" target="_blank" style="color: #64748b; font-size: 11px; text-decoration: none; font-weight: bold;">⚙️ Open Configuration Dictionary Editor</a>
      </div>
      <div style="clear: both;"></div>
