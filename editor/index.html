<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automation Configuration Manager</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
    }
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 30px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; color: #1e3a8a; font-size: 28px; }
    h2 { color: #2563eb; font-size: 18px; margin: 30px 0 15px 0; border-left: 4px solid #2563eb; padding-left: 10px; }
    
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th { background-color: #f1f5f9; font-weight: 600; color: #475569; font-size: 14px; }
    
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: #2563eb; background-color: #f8fafc; }
    
    .btn {
      background-color: #2563eb; color: #ffffff; border: none; padding: 10px 20px;
      border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex;
      align-items: center; gap: 8px; font-size: 14px; transition: background 0.2s;
    }
    .btn:hover { background-color: #1d4ed8; }
    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-danger { background-color: #ef4444; padding: 6px 12px; font-size: 12px; }
    .btn-danger:hover { background-color: #dc2626; }
    
    .flex-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .tag-input-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; }
    .tag { background: #e2e8f0; padding: 4px 10px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .tag-close { cursor: pointer; color: #64748b; font-weight: bold; }
    .tag-close:hover { color: #ef4444; }

    #output-container { display: none; margin-top: 30px; }
    pre { background: #0f172a; color: #38bdf8; padding: 20px; border-radius: 8px; overflow-x: auto; font-size: 13px; max-height: 500px; }
  </style>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>Automation Configuration Manager</h1>
    <button class="btn" id="compile-btn">Compile Configuration Script</button>
  </header>

  <!-- DEFAULTS & KEYWORDS -->
  <h2>Global Settings & Dynamic Keywords</h2>
  <div class="card">
    <div style="margin-bottom:20px;">
      <label style="display:block; font-weight:600; margin-bottom:6px;">Default Project Type</label>
      <input type="text" id="def-projectType" style="max-width:300px;">
    </div>
    
    <div style="margin-bottom:20px;">
      <label style="display:block; font-weight:600; margin-bottom:6px;">Unconditioned Room Keywords</label>
      <div id="unconditioned-tags" class="tag-input-container"></div>
      <div style="margin-top:8px;" class="flex-group">
        <input type="text" id="add-unconditioned-input" placeholder="Add room keyword..." style="max-width:200px;">
        <button class="btn btn-secondary" style="padding:6px 12px;" onclick="addTag('unconditioned')">Add</button>
      </div>
    </div>

    <div>
      <label style="display:block; font-weight:600; margin-bottom:6px;">Double Glazing Keywords</label>
      <div id="glazing-tags" class="tag-input-container"></div>
      <div style="margin-top:8px;" class="flex-group">
        <input type="text" id="add-glazing-input" placeholder="Add glazing keyword..." style="max-width:200px;">
        <button class="btn btn-secondary" style="padding:6px 12px;" onclick="addTag('glazing')">Add</button>
      </div>
    </div>
  </div>

  <!-- DICTIONARIES EDITOR MAPPER -->
  <h2>Data Lookup Maps & Mappings</h2>
  <div id="dictionaries-container"></div>

  <!-- COMPILED SCRIPT TARGET GENERATION -->
  <div id="output-container" class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0; color:#0f172a;">Compiled Configuration Output</h3>
      <button class="btn btn-secondary" onclick="copyToClipboard()">Copy Code</button>
    </div>
    <p style="font-size:13px; color:#64748b; margin-top:0;">Replace your current standalone configuration file block with this output.</p>
    <pre id="output-code"></pre>
  </div>
</div>

<script src="editor.js">
  
</script>

</body>
</html>
